<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set theme trước khi React mount, tránh nhấp nháy sai theme lúc tải trang. Mặc định sáng.
      try {
        var t = localStorage.getItem("newsdesk-theme");
        document.documentElement.classList.toggle("dark", t === "dark");
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tin công nghệ, AI, lập trình và tin ảnh hưởng nghề dev từ các nguồn quốc tế chính thống, tin quan trọng nhất lên đầu, dẫn về bài gốc."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap"
      rel="stylesheet"
    />
    <title>Newsdesk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
